name: grimorio
description: "Grimório RPG: app para gerenciar campanhas de RPG de mesa."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  go_router: ^18.1.4
  dio: ^5.11.1
  google_fonts: ^9.0.0
  pixelarticons: ^0.17.0
  flutter_floating_bottom_bar: ^3.1.0
  provider: ^6.1.5+1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: 0.14.4

flutter:
  uses-material-design: true

  assets:
    - images/acessorios/
    - images/armaduras/leve/
    - images/armaduras/medio/
    - images/armaduras/pesado/
    - images/armas/
    - images/artifice/
    - images/barbaro/
    - images/bardo/
    - images/bg/
    - images/bruxo/
    - images/classes/
    - images/clerico/
    - images/druida/
    - images/feiticeiro/
    - images/gerais/
    - images/guerreiro/
    - images/itens_menu/
    - images/logo/
    - images/mago/
    - images/monge/
    - images/paladino/
    - images/patrulheiro/
    - images/pocoes/
    - images/ladino/
    - images/slot/
    - images/species/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: images/logo/icon_foreground.png
  adaptive_icon_background: "#141218"
  adaptive_icon_foreground: images/logo/icon_foreground.png
  remove_alpha_ios: true